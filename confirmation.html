<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background: #000;
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }

      .confirmation {
        text-align: center;
        max-width: 650px;
      }

      .icon {
        width: 90px;
        height: 90px;
        border: 2px solid white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        margin: 0 auto 35px;
      }

      h1 {
        font-size: 72px;
        font-weight: 300;
        line-height: 1;
        margin-bottom: 25px;
      }

      p {
        color: #bdbdbd;
        font-size: 18px;
        line-height: 1.8;
        max-width: 500px;
        margin: 0 auto 45px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 180px;
        height: 58px;
        border-radius: 12px;
        background: #ececec;
        color: #111;
        text-decoration: none;
        font-size: 20px;
        transition: 0.3s;
      }

      .btn:hover {
        background: white;
        transform: translateY(-2px);
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 48px;
        }

        p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="confirmation">
      <div class="icon">✓</div>

      <h1>Thank You</h1>

      <p>
        Your appraisal request has been successfully submitted. Our team will
        review your poster and contact you as soon as possible.
      </p>

      <a href="index.html" class="btn"> Back Home </a>
    </div>
  </body>
</html>
